<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PayPe · Merchants</title>
<style>
  :root{--ink:#FBF3F8; --violet:#DA0077; --violet-dark:#FF3D95; --mist:#140611; --line:#3A1730;
    --green:#3DD9A0; --green-bg:rgba(61,217,160,.15); --red:#FF6B7A; --red-bg:rgba(255,107,122,.15);}
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:"Segoe UI", system-ui, sans-serif; background:var(--mist); color:var(--ink); min-height:100vh;}
  header{background:#1E0A1A; border-bottom:1px solid var(--line); padding:14px 24px;
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;}
  .brand{font-size:20px; font-weight:800; color:var(--violet-dark);}
  nav a{margin-right:16px; text-decoration:none; color:#59527A; font-size:14px; font-weight:600;}
  nav a.active{color:var(--violet-dark); border-bottom:2px solid var(--violet);}
  .logout{background:none; border:1.5px solid var(--line); border-radius:8px; padding:8px 16px;
    font-size:13px; font-weight:600; color:#59527A; cursor:pointer;}
  main{max-width:1000px; margin:0 auto; padding:24px 16px 60px;}
  .panel{background:#1E0A1A; border:1px solid var(--line); border-radius:12px; padding:22px; margin-bottom:24px;}
  h2{font-size:16px; margin-bottom:14px;}
  .grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px;}
  label{display:block; font-size:12px; font-weight:600; margin-bottom:4px; color:#59527A;}
  input{width:100%; border:1.5px solid var(--line); border-radius:8px; padding:10px; font-size:14px; outline:0;}
  input:focus{border-color:var(--violet);}
  .actions{margin-top:16px; display:flex; align-items:center; gap:14px; flex-wrap:wrap;}
  button.primary{padding:11px 22px; font-size:14px; font-weight:700; color:#fff;
    background:var(--violet); border:0; border-radius:8px; cursor:pointer;}
  button.primary:hover{background:var(--violet-dark);}
  button.primary:disabled{opacity:.6;}
  .msg{font-size:13px; min-height:18px;}
  .msg.ok{color:var(--green);} .msg.err{color:var(--red);}
  .toolbar{display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:10px; flex-wrap:wrap;}
  .search{max-width:280px;}
  .tablewrap{background:#1E0A1A; border:1px solid var(--line); border-radius:12px; overflow-x:auto;}
  table{width:100%; border-collapse:collapse; font-size:13px; min-width:760px;}
  th{text-align:left; padding:10px 14px; color:#59527A; font-weight:600; border-bottom:1px solid var(--line);
    font-size:11px; text-transform:uppercase; letter-spacing:.05em;}
  td{padding:10px 14px; border-bottom:1px solid #24101F;}
  tr:last-child td{border-bottom:0;}
  .chip{display:inline-block; padding:3px 10px; border-radius:99px; font-size:11px; font-weight:700;}
  .ACTIVE{background:var(--green-bg); color:var(--green);}
  .SUSPENDED{background:var(--red-bg); color:var(--red);}
  .toggle{background:none; border:1px solid var(--line); border-radius:6px; padding:5px 10px;
    font-size:12px; cursor:pointer; color:#59527A;}
  .toggle:hover{border-color:var(--violet); color:var(--violet-dark);}
  .empty{padding:24px; text-align:center; color:#7A7396; font-size:13px;}

  .actions-cell{display:flex;flex-direction:column;gap:6px;min-width:150px;}
  .actions-row{display:flex;gap:6px;flex-wrap:wrap;}
  .cat-select{background:var(--void);border:1px solid var(--edge);border-radius:7px;
    color:var(--bone);font-size:12px;font-family:"Outfit",sans-serif;padding:6px 8px;
    cursor:pointer;width:100%;}
  .cat-select:focus{border-color:var(--magenta);outline:0;}
  .btn-danger{color:var(--red)!important;}
  
  #tbl, table#tbl{table-layout:fixed;width:100%;min-width:0;}
  #tbl th:nth-child(1),#tbl td:nth-child(1){width:13%;}
  #tbl th:nth-child(2),#tbl td:nth-child(2){width:16%;}
  #tbl th:nth-child(3),#tbl td:nth-child(3){width:8%;}
  #tbl th:nth-child(4),#tbl td:nth-child(4){width:16%;}
  #tbl th:nth-child(5),#tbl td:nth-child(5){width:16%;}
  #tbl th:nth-child(6),#tbl td:nth-child(6){width:8%;}
  #tbl th:nth-child(7),#tbl td:nth-child(7){width:9%;}
  #tbl th:nth-child(8),#tbl td:nth-child(8){width:14%;}
  #tbl td{padding:9px 8px;font-size:12px;}
  #tbl th{padding:9px 8px;font-size:9.5px;}
  .truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;max-width:100%;}
  .actions-cell{display:flex;flex-direction:column;gap:5px;min-width:0;}
  .actions-row{display:flex;gap:4px;flex-wrap:wrap;}
  .actions-row .toggle{padding:4px 7px;font-size:10.5px;flex:1;min-width:0;text-align:center;}
  .cat-select{font-size:10.5px;padding:5px 6px;}
  .tablewrap{overflow-x:visible;}
  @media(max-width:900px){
    #tbl{table-layout:auto;min-width:640px;}
    .tablewrap{overflow-x:auto;}
  }
  </style>
</head>
<body>
<header>
  <div style="display:flex; align-items:center; gap:26px;">
    <div class="brand">PayPe Admin</div>
    <nav>
      <a href="/admin/dashboard.html">Dashboard</a>
      <a href="/admin/merchants.html" class="active">Merchants</a>
    </nav>
  </div>
  <button class="logout" onclick="logout()">Log out</button>
</header>
<main>
  <div class="panel">
    <h2>Onboard a merchant</h2>
    <div class="grid">
      <div><label>Business name *</label><input id="fName" placeholder="Sri Lakshmi Stores" /></div>
      <div><label>PhonePe MID *</label><input id="fMid" placeholder="TSPPAYPE (UAT) / real MID (prod)" /></div>
      <div><label>Website domain *</label><input id="fDomain" placeholder="https://www.example.com" /></div>
      <div><label>Contact person</label><input id="fContact" placeholder="Owner name" /></div>
      <div><label>Email</label><input id="fEmail" placeholder="owner@example.com" /></div>
      <div><label>Phone</label><input id="fPhone" placeholder="+91 98xxxxxx" /></div>
    </div>
    <div class="actions">
      <button class="primary" id="addBtn" onclick="addMerchant()">Onboard merchant</button>
      <span class="msg" id="formMsg"></span>
    </div>
  </div>
  <div class="toolbar">
    <h2 style="margin:0">Merchants <span id="count" style="color:#7A7396; font-weight:400"></span></h2>
    <input class="search" id="search" placeholder="Search name, MID, domain…" oninput="render()" />
  </div>
  <div class="tablewrap">
    <table id="tbl">
      <thead><tr>
        <th>Merchant ID</th><th>Business</th><th>MID</th><th>Domain</th>
        <th>Contact</th><th>Status</th><th>Onboarded</th><th></th>
      </tr></thead>
      <tbody></tbody>
    </table>
    <div class="empty" id="empty" style="display:none">No merchants yet — onboard your first one above</div>
  </div>
</main>
<script>
let merchants = [];
const fmtTime = (ms) => ms ? new Date(ms).toLocaleDateString("en-IN", { dateStyle:"medium" }) : "";

async function load() {
  const res = await fetch("/api/admin/merchants");
  if (res.status === 401) { window.location.href = "/admin/login.html"; return; }
  merchants = (await res.json()).merchants || [];
  render();
}

function render() {
  const q = (document.getElementById("search").value || "").toLowerCase();
  const rows = merchants.filter(m =>
    !q || [m.businessName, m.mid, m.domain, m.merchantId].join(" ").toLowerCase().includes(q)
  );
  document.getElementById("count").textContent = "(" + rows.length + ")";
  const body = document.querySelector("#tbl tbody");
  body.innerHTML = rows.map(m => `<tr>
    <td>${m.merchantId}</td>
    <td><strong>${m.businessName}</strong></td>
    <td>${m.mid}</td>
    <td><span class="truncate" title="${m.domain}">${m.domain}</span></td>
    <td>${m.contactName || "—"}${m.email ? "<br><span style='color:#7A7396;font-size:11px'>" + m.email + "</span>" : ""}</td>
    <td><span class="chip ${m.status}">${m.status}</span></td>
    <td>${fmtTime(m.createdAt)}</td>
    <td><button class="toggle" onclick="editContact('${m.merchantId}','${m.phone||""}','${m.email||""}')">Edit</button>
      <button class="toggle" onclick="editCategory('${m.merchantId}','${m.pricingCategory||""}')">${m.pricingCategory || "Set category"}</button>
      <button class="toggle" onclick="deleteMerchant('${m.merchantId}','${m.businessName.replace(/'/g,"")}')" style="color:#B3261E">Del</button>
      <button class="toggle" onclick="toggleStatus('${m.merchantId}','${m.status}')">
      ${m.status === "ACTIVE" ? "Suspend" : "Activate"}</button></td>
  </tr>`).join("");
  document.getElementById("empty").style.display = rows.length ? "none" : "block";
}

async function addMerchant() {
  const btn = document.getElementById("addBtn");
  const msg = document.getElementById("formMsg");
  btn.disabled = true; msg.className = "msg"; msg.textContent = "Onboarding…";
  try {
    const res = await fetch("/api/admin/merchants", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        businessName: document.getElementById("fName").value,
        mid: document.getElementById("fMid").value,
        domain: document.getElementById("fDomain").value,
        contactName: document.getElementById("fContact").value,
        email: document.getElementById("fEmail").value,
        phone: document.getElementById("fPhone").value,
      }),
    });
    const data = await res.json();
    if (res.ok) {
      msg.className = "msg ok"; msg.textContent = "✅ " + data.merchant.businessName + " onboarded (" + data.merchant.merchantId + ")";
      ["fName","fMid","fDomain","fContact","fEmail","fPhone"].forEach(id => document.getElementById(id).value = "");
      load();
    } else {
      msg.className = "msg err"; msg.textContent = data.error || "Failed";
    }
  } catch {
    msg.className = "msg err"; msg.textContent = "Could not reach the server";
  }
  btn.disabled = false;
}

async function editCategory(id, current) {
  const options = ["ECOM","EDUCATION","GROCERY","GOVT","NBFC","B2B"];
  const labels = { ECOM:"E-Com/Hotel/Travel/NGO", EDUCATION:"Education", GROCERY:"Grocery", GOVT:"Government", NBFC:"NBFC (Lending)", B2B:"B2B" };
  const list = options.map((o,i) => (i+1) + ". " + labels[o]).join("\n");
  const choice = prompt("Choose a pricing category by number:\n\n" + list + "\n\nCurrent: " + (current || "none"), "");
  if (choice === null) return;
  const idx = parseInt(choice, 10) - 1;
  if (idx < 0 || idx >= options.length) { alert("Enter a number from 1 to " + options.length); return; }
  const category = options[idx];
  const res = await fetch("/api/admin/merchants/" + id + "/category", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ category: category }),
  });
  const data = await res.json();
  if (res.ok) { load(); } else { alert(data.error || "Could not set category"); }
}

async function setCategoryDirect(id, category) {
  if (!category) return;
  const res = await fetch("/api/admin/merchants/" + id + "/category", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ category: category }),
  });
  const data = await res.json();
  if (!res.ok) { alert(data.error || "Could not set category"); load(); }
}

async function deleteMerchant(id, name) {
  if (!confirm("Delete " + name + "?\n\nIf they have no payment history, they are removed completely.\nIf they have payments or refunds, their account is hidden but that history is kept for records.")) return;
  const res = await fetch("/api/admin/merchants/" + id, { method: "DELETE" });
  const data = await res.json();
  if (res.ok) {
    alert(data.mode === "deleted" ? "Merchant removed completely." : "Merchant hidden. Their transaction history is preserved.");
    load();
  } else {
    alert(data.error || "Could not delete merchant");
  }
}

async function editContact(id, currentPhone, currentEmail) {
  const phone = prompt("Mobile number for this merchant (used for SMS sign-in):", currentPhone || "");
  if (phone === null) return;
  const res = await fetch("/api/admin/merchants/" + id + "/contact", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ phone: phone }),
  });
  const data = await res.json();
  if (res.ok) { load(); } else { alert(data.error || "Could not update"); }
}

async function toggleStatus(id, current) {
  const next = current === "ACTIVE" ? "SUSPENDED" : "ACTIVE";
  await fetch(`/api/admin/merchants/${id}/status`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ status: next }),
  });
  load();
}

async function logout() {
  await fetch("/api/admin/logout", { method: "POST" });
  window.location.href = "/admin/login.html";
}

load();
</script>
</body>
</html>
