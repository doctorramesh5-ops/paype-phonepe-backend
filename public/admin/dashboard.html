<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Transactions · PayPe Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Outfit:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#140611; --panel:#1E0A1A; --panel-2:#260E21; --edge:#3A1730; --edge-lit:#5C2247;
    --magenta:#DA0077; --magenta-lit:#FF3D95;
    --teal:#3DD9A0; --teal-bg:rgba(61,217,160,.15);
    --amber:#F5B94A; --amber-bg:rgba(245,185,74,.15);
    --red:#FF6B7A; --red-bg:rgba(255,107,122,.15);
    --bone:#FBF3F8; --ash:#A794A2; --ash-dim:#74606F;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--void);color:var(--bone);font-family:"Outfit",system-ui,sans-serif;
    font-size:15px;line-height:1.55;font-weight:300;-webkit-font-smoothing:antialiased;}
  h1,h2{font-family:"Playfair Display",Georgia,serif;font-weight:600;}
  .mono{font-family:"IBM Plex Mono",monospace;}
  a{color:var(--magenta-lit);text-decoration:none;}
  header{background:var(--panel);border-bottom:1px solid var(--edge);padding:14px 24px;
    display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;position:sticky;top:0;z-index:10;}
  .brand{display:flex;align-items:center;gap:22px;flex-wrap:wrap;}
  .logo{font-family:"Playfair Display",serif;font-weight:700;font-size:19px;color:var(--magenta-lit);}
  nav{display:flex;gap:4px;flex-wrap:wrap;}
  nav a{padding:8px 13px;border-radius:8px;font-size:13.5px;font-weight:500;color:var(--ash);text-decoration:none;}
  nav a:hover{background:var(--panel-2);color:var(--bone);}
  nav a.on{background:rgba(218,0,119,.15);color:var(--magenta-lit);}
  .logout{background:none;border:1px solid var(--edge);border-radius:8px;padding:8px 15px;
    font-size:13px;font-weight:500;color:var(--ash);cursor:pointer;}
  main{max-width:1080px;margin:0 auto;padding:26px 18px 70px;}
  .eyebrow{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--magenta-lit);
    letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px;}
  h1{font-size:26px;letter-spacing:-.02em;margin-bottom:18px;}
  h2{font-size:16px;font-weight:600;margin:26px 0 12px;letter-spacing:-.01em;}
  h2:first-of-type{margin-top:0;}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;}
  .kpi{background:var(--panel);border:1px solid var(--edge);border-radius:14px;padding:16px 18px;}
  .kpi .n{font-family:"Playfair Display",serif;font-size:23px;font-weight:700;letter-spacing:-.02em;}
  .kpi .l{font-size:11.5px;color:var(--ash);margin-top:3px;}
  .toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap;}
  .search{max-width:280px;width:100%;border:1.5px solid var(--edge);border-radius:9px;padding:10px 13px;
    font-size:13.5px;background:var(--panel);color:var(--bone);outline:0;}
  .search:focus{border-color:var(--magenta);}
  .tablewrap{background:var(--panel);border:1px solid var(--edge);border-radius:14px;overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:600px;}
  th{text-align:left;padding:12px 16px;border-bottom:1px solid var(--edge);color:var(--ash-dim);
    font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:500;}
  td{padding:11px 16px;border-bottom:1px solid #24101F;color:var(--ash);vertical-align:top;}
  tr:last-child td{border-bottom:0;}
  td.mono-id{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--bone);}
  .chip{display:inline-block;padding:3px 10px;border-radius:99px;font-size:10.5px;font-weight:700;}
  .COMPLETED{background:var(--teal-bg);color:var(--teal);}
  .FAILED{background:var(--red-bg);color:var(--red);}
  .PENDING{background:var(--amber-bg);color:var(--amber);}
  .empty{padding:34px;text-align:center;color:var(--ash-dim);font-size:13.5px;}
  @media(max-width:820px){ .kpis{grid-template-columns:1fr 1fr;} }
  @media(max-width:520px){ nav{display:none;} }
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">PayPe Admin</div>
    <nav>
      <a href="/admin/overview.html">Overview</a>
      <a href="/admin/dashboard.html" class="on">Transactions</a>
      <a href="/admin/merchants.html">Merchants</a>
      <a href="/admin/reports.html">Reports</a>
      <a href="/admin/settings.html">Settings</a>
    </nav>
  </div>
  <button class="logout" onclick="logout()">Log out</button>
</header>
<main>
  <div class="eyebrow">All transactions</div>
  <h1>Orders &amp; refunds</h1>
  <div class="kpis">
    <div class="kpi"><div class="n" id="sTotal">–</div><div class="l">Total orders</div></div>
    <div class="kpi"><div class="n" id="sDone">–</div><div class="l">Completed</div></div>
    <div class="kpi"><div class="n" id="sAmount">–</div><div class="l">Completed value (₹)</div></div>
    <div class="kpi"><div class="n" id="sRefunds">–</div><div class="l">Refunds</div></div>
  </div>
  <div class="toolbar">
    <h2 style="margin:0">Orders</h2>
    <input class="search" id="search" placeholder="Search order ID…" oninput="render()" />
  </div>
  <div class="tablewrap">
    <table id="ordersTable">
      <thead><tr><th>Order ID</th><th>Amount (₹)</th><th>State</th><th>Created</th><th>Last event</th></tr></thead>
      <tbody></tbody>
    </table>
    <div class="empty" id="ordersEmpty" style="display:none">No orders yet</div>
  </div>
  <h2>Refunds</h2>
  <div class="tablewrap">
    <table id="refundsTable">
      <thead><tr><th>Refund ID</th><th>Original order</th><th>Amount (₹)</th><th>State</th><th>Created</th></tr></thead>
      <tbody></tbody>
    </table>
    <div class="empty" id="refundsEmpty" style="display:none">No refunds yet</div>
  </div>
</main>
<script>
let allOrders = [];
const fmtTime = (ms) => ms ? new Date(ms).toLocaleString("en-IN", { dateStyle:"medium", timeStyle:"short" }) : "";
const fmtAmt  = (paise) => ((paise||0) / 100).toLocaleString("en-IN");
function toLogin() { window.location.href = "/admin/login.html"; }
async function load() {
  const [oRes, rRes] = await Promise.all([fetch("/api/admin/orders"), fetch("/api/admin/refunds")]);
  if (oRes.status === 401 || rRes.status === 401) { toLogin(); return; }
  const { orders = [] } = await oRes.json();
  const { refunds = [] } = await rRes.json();
  allOrders = orders;
  const done = orders.filter(o => o.state === "COMPLETED");
  document.getElementById("sTotal").textContent = orders.length;
  document.getElementById("sDone").textContent = done.length;
  document.getElementById("sAmount").textContent = fmtAmt(done.reduce((s,o) => s + (o.amount||0), 0));
  document.getElementById("sRefunds").textContent = refunds.length;
  const rBody = document.querySelector("#refundsTable tbody");
  rBody.innerHTML = refunds.map(r => `<tr>
    <td class="mono-id">${r.merchantRefundId||""}</td>
    <td class="mono-id">${r.originalMerchantOrderId||""}</td>
    <td>${fmtAmt(r.amount)}</td>
    <td><span class="chip ${r.state||""}">${r.state||"?"}</span></td>
    <td>${fmtTime(r.createdAt)}</td>
  </tr>`).join("");
  document.getElementById("refundsEmpty").style.display = refunds.length ? "none" : "block";
  render();
}
function render() {
  const q = (document.getElementById("search").value || "").toLowerCase();
  const rows = allOrders.filter(o => !q || (o.merchantOrderId||"").toLowerCase().includes(q));
  const body = document.querySelector("#ordersTable tbody");
  body.innerHTML = rows.map(o => `<tr>
    <td class="mono-id">${o.merchantOrderId||""}</td>
    <td>${fmtAmt(o.amount)}</td>
    <td><span class="chip ${o.state||""}">${o.state||"?"}</span></td>
    <td>${fmtTime(o.createdAt)}</td>
    <td style="color:var(--ash-dim)">${o.lastWebhookEvent||"—"}</td>
  </tr>`).join("");
  document.getElementById("ordersEmpty").style.display = rows.length ? "none" : "block";
}
async function logout() { await fetch("/api/admin/logout", { method: "POST" }); toLogin(); }
load();
</script>
</body>
</html>
