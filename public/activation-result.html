<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PayPe · Activation Status</title>
<style>
  :root{--void:#140611;--panel:#1E0A1A;--edge:#3A1730;--magenta:#DA0077;--magenta-lit:#FF3D95;--teal:#3DD9A0;--red:#FF6B7A;--amber:#F5B94A;--bone:#FBF3F8;--ash:#A794A2;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--void);color:var(--bone);font-family:system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .card{background:var(--panel);border:1px solid var(--edge);border-radius:16px;max-width:420px;width:100%;padding:36px 32px;text-align:center;}
  .icon{font-size:48px;margin-bottom:14px;}
  h1{font-size:21px;margin-bottom:8px;font-family:Georgia,serif;}
  p{color:var(--ash);font-size:14px;line-height:1.6;}
  .order{margin-top:14px;font-size:12px;color:#74606F;word-break:break-all;}
  a{display:inline-block;margin-top:22px;color:var(--magenta-lit);font-weight:600;text-decoration:none;}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="icon" id="icon">⏳</div>
  <h1 id="title">Checking payment status…</h1>
  <p id="detail">Please wait a moment.</p>
  <p class="order" id="order"></p>
  <a href="/activation-pricing.html">← Back to pricing</a>
</div>
<script>
const orderId = new URLSearchParams(window.location.search).get("orderId");
const views = {
  PAID: { icon:"✅", title:"Payment successful", detail:"We will email your live PayPe credentials within 1 business day." },
  COMPLETED: { icon:"✅", title:"Payment successful", detail:"We will email your live PayPe credentials within 1 business day." },
  FAILED: { icon:"❌", title:"Payment failed", detail:"The payment did not go through. Please try again, or contact admin@paype.co.in." },
  PENDING: { icon:"⏳", title:"Payment pending", detail:"Your payment is still processing. This page will not auto-update — refresh in a minute." },
};
async function checkStatus() {
  if (!orderId) { document.getElementById("title").textContent = "No order reference found"; return; }
  document.getElementById("order").textContent = "Reference: " + orderId;
  try {
    const res = await fetch("/api/activation/phonepe-status/" + orderId);
    const data = await res.json();
    const v = views[data.state] || { icon:"❓", title:"Status: " + (data.state || "unknown"), detail:"Contact admin@paype.co.in with your reference number." };
    document.getElementById("icon").textContent = v.icon;
    document.getElementById("title").textContent = v.title;
    document.getElementById("detail").textContent = v.detail;
  } catch {
    document.getElementById("title").textContent = "Could not check status";
    document.getElementById("detail").textContent = "Refresh this page, or contact admin@paype.co.in with your reference number above.";
  }
}
checkStatus();
</script>
</body>
</html>
